<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Infographic Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ AI Infographic Generator</h1>
            <p class="subtitle">Transform your articles into stunning infographics with AI</p>
            <div class="features">
                <span class="feature-badge">📊 Auto-Design</span>
                <span class="feature-badge">🎨 Smart Layout</span>
                <span class="feature-badge">⚡ Fast Export</span>
            </div>
        </header>

        <div class="card">
            <form id="infographicForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="article_name">
                        Article Name <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="article_name" 
                        name="article_name" 
                        placeholder="Enter a descriptive name for your article"
                        minlength="3"
                    >
                </div>

                <div class="form-group">
                    <label for="article_text">
                        Article Content <span class="required">*</span>
                    </label>
                    <textarea 
                        id="article_text" 
                        name="article_text" 
                        rows="8" 
                        placeholder="Paste your article content here (minimum 50 characters)"
                        minlength="50"
                    ></textarea>
                </div>

                <div id="validationMessage" class="validation-message"></div>

                <div class="button-group">
                    <button type="submit" id="submitBtn" class="submit-btn">
                        ✨ Generate Infographic
                    </button>
                    <button type="button" class="clear-btn" onclick="clearForm()">
                        🗑️ Clear Form
                    </button>
                </div>
            </form>
        </div>

        <div id="results" class="results"></div>

        <footer>
            <p>Powered by Google Gemini AI • Built with FastAPI</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
