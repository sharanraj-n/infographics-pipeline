<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic Generator - AI Powered</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: fadeInDown 0.8s ease;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            animation: fadeInUp 0.8s ease;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 1s ease;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 8px;
            color: #555;
        }

        input[type='text'], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type='text']:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #results {
            animation: fadeIn 0.5s ease;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .success-message {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .success-message h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .download-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            display: block;
        }

        .download-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .download-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .download-card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #667eea;
        }

        .download-card p {
            font-size: 0.9rem;
            color: #777;
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature-item {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            .card {
                padding: 25px;
            }
            .download-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 AI Infographic Generator</h1>
            <p>Transform your articles into beautiful infographics instantly</p>
            
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">⚡</div>
                    <strong>Lightning Fast</strong>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🤖</div>
                    <strong>AI Powered</strong>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📊</div>
                    <strong>Smart Charts</strong>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📄</div>
                    <strong>Multi-Format</strong>
                </div>
            </div>
        </header>

        <div class="card">
            <form id="infographicForm">
                <div class="form-group">
                    <label for="article_name">📝 Article Name</label>
                    <input 
                        type="text" 
                        name="article_name" 
                        id="article_name" 
                        placeholder="e.g., solar_power_2025" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="article_text">📰 Article Content</label>
                    <textarea 
                        name="article_text" 
                        id="article_text" 
                        placeholder="Paste your article text here... The AI will analyze it and create stunning infographics with charts, key points, and visual suggestions." 
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    ✨ Generate Infographic
                </button>
            </form>
        </div>

        <div id="results"></div>

        <footer>
            <p>Powered by Google Gemini AI • Built with ❤️</p>
        </footer>
    </div>

    <script>
        const form = document.getElementById('infographicForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultsDiv = document.getElementById('results');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Generating...';
            
            resultsDiv.innerHTML = `
                <div class="card loading">
                    <div class="spinner"></div>
                    <h3>Creating your infographic...</h3>
                    <p>This may take 10-30 seconds</p>
                </div>
            `;

            const formData = new FormData(form);

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.files && Object.keys(result.files).length > 0) {
                    // Success
                    let html = `
                        <div class="card">
                            <div class="success-message">
                                <h2>✅ Success!</h2>
                                <p>Your infographic has been generated successfully</p>
                            </div>
                            <div class="download-grid">
                    `;

                    const fileIcons = {
                        html: '🌐',
                        png: '📊',
                        pdf: '📄'
                    };

                    const fileDescriptions = {
                        html: 'Interactive web version',
                        png: 'Chart image',
                        pdf: 'Printable document'
                    };

                    for (const [fileType, filePath] of Object.entries(result.files)) {
                        const fileName = filePath.replace('generated/', '');
                        html += `
                            <a href="/download/${result.article_name}/${fileType}" 
                               class="download-card" 
                               target="_blank">
                                <div class="download-icon">${fileIcons[fileType]}</div>
                                <h3>${fileType.toUpperCase()}</h3>
                                <p>${fileDescriptions[fileType]}</p>
                                <small>${fileName}</small>
                            </a>
                        `;
                    }

                    html += `
                            </div>
                        </div>
                    `;

                    resultsDiv.innerHTML = html;
                } else if (result.error) {
                    resultsDiv.innerHTML = `
                        <div class="card">
                            <div class="error-message">
                                <h3>❌ Error</h3>
                                <p>${result.error}</p>
                            </div>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="card">
                            <div class="error-message">
                                <h3>⚠️ No files generated</h3>
                                <p>Please try again or check your input</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="card">
                        <div class="error-message">
                            <h3>❌ Network Error</h3>
                            <p>${error.message}</p>
                        </div>
                    </div>
                `;
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = '✨ Generate Infographic';
            }
        });
    </script>
</body>
</html>
