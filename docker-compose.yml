version: '3.8'

services:
  infographic-pipeline:
    build: .
    container_name: infographic-pipeline
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
    volumes:
      - ./generated:/app/generated
      - ./.env:/app/.env
    restart: unless-stopped
